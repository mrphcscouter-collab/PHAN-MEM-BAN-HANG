<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#133f53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tra cứu gạch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Tra cứu gạch men</title>
<style>
:root{--bg:#e6e8e9;--card:#fff;--ink:#1b2326;--mute:#5d686d;--line:#d0d6d9;--grout:#b7bfc3;--ac:#1d5c78;--acd:#133f53;--acl:#e3eef3;--red:#b3261e;--ok:#2f7d4f;--warn:#a15c00}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(68px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 14px;min-height:42px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.dz{color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-height:42px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label input,label select,label textarea{margin-top:3px;color:var(--ink);font-size:16px}
header{position:sticky;top:0;z-index:20;background:var(--acd);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{min-height:34px;padding:4px 11px;font-size:13px;border-radius:17px;background:transparent;color:#d5e3ea;border-color:#4d7387;white-space:nowrap}
#syncbtn.s-ok{color:#8be0c2;border-color:#3b8a70}#syncbtn.s-busy{color:#a9d3ff}#syncbtn.s-dirty,#syncbtn.s-offline{color:#ffd37a;border-color:#9a7a2a}#syncbtn.s-auth,#syncbtn.s-err{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:1100px;margin:0 auto;padding:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mute);padding:9px 2px;font-size:12.5px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button b{font-size:20px;line-height:1.1}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.bar{display:flex;gap:8px;margin-bottom:8px}.bar input{flex:1}
.flt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.flt select{padding:8px 6px;font-size:16px;min-height:40px}
.cnt{font-size:13px;color:var(--mute);margin:2px 2px 6px}
/* tường gạch: các ô ngăn cách bằng mạch vữa */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:3px;background:var(--grout);border:3px solid var(--grout)}
.tc{background:#fff;cursor:pointer;display:flex;flex-direction:column;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 230px}
button,.tc{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.im{aspect-ratio:1;background:#eef0f1;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.tc .tx{padding:7px 9px 9px}.tc b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .pp{margin-top:3px;font-weight:700;color:var(--acd);font-variant-numeric:tabular-nums}.tc .pp small{display:inline;font-weight:400}
.empty{background:#fff;border-radius:12px;padding:26px 18px;text-align:center;color:var(--mute)}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:19;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:26px;padding:0 20px;min-height:50px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 8px}.card p{margin:6px 0}small,.mute{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.row>.g{flex:1;min-width:120px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,20,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sb{background:#fff;width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sb{border-radius:16px}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sh b{font-size:17px}.x{border:0;font-size:18px;min-height:36px;padding:4px 10px}
.big{aspect-ratio:4/3;background:#eef0f1;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute);cursor:zoom-in}.big img{width:100%;height:100%;object-fit:contain;background:#fff}
h2.nm{font-size:19px;margin:10px 0 6px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14.5px;margin:6px 0 10px}.spec span{color:var(--mute)}
.pr{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;background:var(--acl);border-radius:10px;padding:10px 14px;margin:8px 0}
.pm{font-size:26px;font-weight:800;color:var(--acd);font-variant-numeric:tabular-nums}.pb{font-size:18px;font-weight:700;color:var(--acd);font-variant-numeric:tabular-nums}.pr small{font-weight:400;font-size:13px}
.cost{background:#fff4de;color:#6b4300;border-radius:9px;padding:7px 12px;font-size:14px;margin:6px 0}
.calc{border:1px dashed var(--grout);border-radius:10px;padding:10px;margin:8px 0}.calc .res{font-weight:600;margin-top:4px;min-height:22px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts button{flex:1 1 130px}
.ql{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.ql .im{width:52px;height:52px;border-radius:7px;flex:none}.ql .g{flex:1;min-width:0}.ql input{width:92px}
.tot{font-size:20px;font-weight:800;color:var(--acd);text-align:right;margin:10px 0;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:5px;padding:0 7px;font-size:12px;font-weight:600;background:var(--acl);color:var(--acd)}.tag.ok{background:#dff3e7;color:var(--ok)}.tag.w{background:#fff0d4;color:var(--warn)}
.lr{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.lr .im{width:42px;height:42px;border-radius:6px;flex:none}.lr .g{flex:1;min-width:0}.lr input[type=number]{width:64px}.lr input[type=checkbox]{width:22px;min-height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#1b2326;color:#fff;padding:10px 16px;border-radius:10px;z-index:300;max-width:90vw;font-size:14px}
.zm{position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:12px}.zm img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.scx{position:fixed;inset:0;z-index:400;background:#000;display:flex;flex-direction:column}.scx video{flex:1;min-height:0;width:100%;object-fit:cover}.scb{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;background:rgba(0,0,0,.6)}.scf{position:absolute;left:14%;right:14%;top:30%;aspect-ratio:1;max-height:40%;border:3px solid #6fd3f5;border-radius:14px;pointer-events:none}.scs{padding:14px 16px;color:#fff;background:rgba(0,0,0,.7);text-align:center;font-weight:600}
textarea{min-height:90px;font-family:inherit}details summary{cursor:pointer;color:var(--ac);font-weight:600}
.crp{position:fixed;inset:0;z-index:450;background:#101518;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top)}.cb{padding:12px 16px 4px}.cb b{display:block;font-size:17px}.cb small{color:#aab6bb}
.cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.cin{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}.cin canvas{display:block}
.cbox{position:absolute;box-shadow:0 0 0 2000px rgba(0,0,0,.6);border:2px solid #fff;touch-action:none;cursor:move;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:33.34% 33.34%}
.cbox i{position:absolute;width:46px;height:46px}.cbox i[data-h=tl]{left:-12px;top:-12px;border-left:6px solid #6fd3f5;border-top:6px solid #6fd3f5}.cbox i[data-h=tr]{right:-12px;top:-12px;border-right:6px solid #6fd3f5;border-top:6px solid #6fd3f5}.cbox i[data-h=bl]{left:-12px;bottom:-12px;border-left:6px solid #6fd3f5;border-bottom:6px solid #6fd3f5}.cbox i[data-h=br]{right:-12px;bottom:-12px;border-right:6px solid #6fd3f5;border-bottom:6px solid #6fd3f5}
.cr{display:flex;gap:8px;padding:6px 14px}.cr button{flex:1;padding:9px 6px;background:#243038;color:#fff;border-color:#33434d}.cr button.pri{background:var(--ac);border-color:var(--ac)}.cr:last-child{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
@media(max-width:480px){.flt{grid-template-columns:1fr 1fr}.thr{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:no-preference){.ov .sb{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>
<header><h1 id="shop">Tra cứu gạch men</h1><button id="own" data-a="own"></button><button id="syncbtn" data-a="gbtn"></button></header>
<main id="main"></main>
<nav>
 <button data-tab="home"><b>▦</b>Tra cứu</button>
 <button data-tab="quote"><b>🧾</b>Báo giá<span id="qn"></span></button>
 <button data-tab="labels"><b>⌗</b>Tem QR</button>
 <button data-tab="settings"><b>⚙</b>Cài đặt</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nz=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
const money=n=>(Math.round(n)||0).toLocaleString('vi-VN')+'đ';
const f2=n=>(Math.round(n*100)/100).toLocaleString('vi-VN');
const fmtD=t=>new Date(t).toLocaleDateString('vi-VN');
const jeq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}

/* ===== Dữ liệu ===== */
const newDb=()=>({v:1,tiles:[],quotes:[],s:{shop:'Cửa hàng gạch men',mk:25,waste:5,bm:{},qrBase:'',phone:'',pnote:'Giá tham khảo, có thể thay đổi',pin:'',u:0}});
function normDb(d){d=d&&typeof d==='object'?d:{};const s=Object.assign(newDb().s,d.s||{});s.bm=s.bm||{};return{v:1,tiles:Array.isArray(d.tiles)?d.tiles:[],quotes:Array.isArray(d.quotes)?d.quotes:[],s}}
let db=newDb(),TH={},IHL={},idb=null,booting=true,tab='home';
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv=m=>idb.transaction('kv',m).objectStore('kv');
const idbO=()=>new Promise((ok,no)=>{const r=indexedDB.open('gachmen',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbG=k=>rq(kv('readonly').get(k)),idbP=(k,v)=>rq(kv('readwrite').put(v,k)),idbD=k=>rq(kv('readwrite').delete(k));
let svT;function persist(){clearTimeout(svT);try{idb?idbP('db',db):LS('gm_db',JSON.stringify(db))}catch(e){}}
function save(mark=true){clearTimeout(svT);svT=setTimeout(persist,250);if(mark)gDirty()}
addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
const live=()=>db.tiles.filter(t=>!t.del);
const tile=id=>db.tiles.find(t=>t.id===id&&!t.del);
const sig=d=>d.tiles.map(t=>t.id+':'+(t.u||0)).sort().join()+'|'+d.quotes.map(t=>t.id+':'+(t.u||0)).sort().join()+'|'+(d.s.u||0);
function mergeDb(a,b){b=normDb(b);const pick=(x,y)=>{const m=new Map();[...y,...x].forEach(r=>{const o=m.get(r.id);if(!o||(r.u||0)>=(o.u||0))m.set(r.id,r)});return[...m.values()]};
  const lim=Date.now()-90*864e5,ok=r=>!(r.del&&(r.u||0)<lim);
  return{v:1,tiles:pick(a.tiles,b.tiles).filter(ok),quotes:pick(a.quotes,b.quotes).filter(ok),s:(a.s.u||0)>=(b.s.u||0)?a.s:b.s}}

/* ===== Giá, quy cách ===== */
const cuName=c=>({m2:'m²',box:'thùng',pc:'viên'}[c]||'m²');
const KINDS={nen:'Lát nền',tuong:'Ốp tường',ca2:'Ốp + lát',ngoai:'Sân vườn / ngoài trời',tt:'Trang trí'};
const dims=s=>{const m=String(s||'').match(/(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)/i);if(!m)return null;let w=+m[1].replace(',','.'),h=+m[2].replace(',','.');if(Math.max(w,h)<=300){w*=10;h*=10}return[w,h]};
const normSize=s=>{const d=dims(s);if(!d)return String(s||'').trim();const a=Math.min(...d)/10,b=Math.max(...d)/10;return a+'x'+b};
const mpb=t=>{if(+t.mpb>0)return +t.mpb;const d=dims(t.size);return d&&+t.ppb>0?d[0]*d[1]*t.ppb/1e6:0};
const mk=t=>{const v=db.s.bm[t.brand];return v!=null&&v!==''?+v:+db.s.mk||0};
const rnd=v=>{const s=v<50000?500:1000;return Math.round(v/s)*s};
const sp=t=>+t.price>0?+t.price:(+t.cost>0?rnd(t.cost*(1+mk(t)/100)):0);
const perM2=t=>{const p=sp(t),m=mpb(t);if(!p)return 0;if(t.cu==='m2')return p;if(!m)return 0;return t.cu==='box'?p/m:(+t.ppb>0?p*t.ppb/m:0)};
const perBox=t=>{const p=sp(t),m=mpb(t);if(!p)return 0;if(t.cu==='box')return p;if(t.cu==='m2')return m?p*m:0;return +t.ppb>0?p*t.ppb:0};
function calc(t,q,w){q=+q||0;const p=sp(t),m=mpb(t);if(!q||!p)return null;
  if(m>0){const boxes=Math.ceil(q*(1+w/100)/m-1e-9),m2=boxes*m,a=perM2(t),b=perBox(t);return{boxes,m2,amt:a?m2*a:boxes*b,txt:boxes+' thùng ('+f2(m2)+' m²)'}}
  return{boxes:q,m2:0,amt:q*p,txt:q+' '+cuName(t.cu)}}
const priceLine=t=>{const a=perM2(t),b=perBox(t),p=sp(t);if(!p)return'<small>Chưa có giá</small>';return a?money(a)+'<small>/m²</small>':b?money(b)+'<small>/thùng</small>':money(p)+'<small>/'+cuName(t.cu)+'</small>'};

/* ===== Chế độ chủ / nhân viên ===== */
const owner=()=>!db.s.pin||LS('gm_own')==='1';
const hashPin=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gm'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('gm'+p)}};
function ownUI(){const b=$('#own');b.style.display=db.s.pin?'':'none';b.textContent=owner()?'🔓 Chủ':'🔒 Nhân viên'}

/* ===== Điều hướng ===== */
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));$('#shop').textContent=db.s.shop;ownUI();
  ({home:vHome,quote:vQuote,labels:vLabels,settings:vSettings})[t]();qBadge();scrollTo(0,0)}
function redraw(){if($('#ov')||$('.scx'))return;if(tab==='home')drawGrid();else if(tab!=='settings'||!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))go(tab)}
function sheet(h){shut();const e=document.createElement('div');e.className='ov';e.id='ov';e.innerHTML='<div class="sb" role="dialog">'+h+'</div>';e.addEventListener('mousedown',ev=>{if(ev.target===e)shut()});document.body.appendChild(e);document.body.style.overflow='hidden';return e.firstChild}
function shut(){const e=$('#ov');if(e)e.remove();document.body.style.overflow='';const z=$('.zm');if(z)z.remove()}

/* ===== Tra cứu ===== */
let q='',fb='',fs='',fc='',fk='',so='new',lim=36;
const imgTag=t=>TH[t.id]?'<img src="'+TH[t.id]+'" alt="" decoding="async">':(t.ih?'Đang tải ảnh…':'Chưa có ảnh');
const XI=new Map(),tx=t=>{let e=XI.get(t.id);if(!e||e.u!==t.u){e={u:t.u,s:nz([t.code,t.name,t.brand,t.size,t.color,t.surface,KINDS[t.kind],t.note].join(' '))};XI.set(t.id,e)}return e.s};
const full=id=>idbG('img:'+id).catch(()=>null);
const uniq=f=>[...new Set(live().map(f).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true}));
const opts=(L,cur,all)=>'<option value="">'+all+'</option>'+L.map(x=>'<option'+(x===cur?' selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join('');
function vHome(){
  $('#main').innerHTML='<div class="bar"><input id="q" type="search" placeholder="Gõ mã, màu, kích thước, hãng…" autocomplete="off" value="'+esc(q)+'"><button class="pri" data-a="scanfind">📷 Quét</button></div>'+
  '<div class="flt"><select id="fb">'+opts(uniq(t=>t.brand),fb,'Mọi hãng')+'</select><select id="fs">'+opts(uniq(t=>t.size),fs,'Mọi cỡ')+'</select><select id="fc">'+opts(uniq(t=>t.color),fc,'Mọi màu')+'</select>'+
  '<select id="so">'+[['new','Mới nhất'],['pa','Giá thấp → cao'],['pd','Giá cao → thấp'],['code','Theo mã']].map(a=>'<option value="'+a[0]+'"'+(so===a[0]?' selected':'')+'>'+a[1]+'</option>').join('')+'</select></div>'+
  '<div class="cnt" id="cnt"></div><div class="grid" id="grid"></div><div id="more" style="text-align:center;margin:12px"></div><button class="pri fab" data-a="add">＋ Thêm mẫu</button>';
  let qT;$('#q').oninput=e=>{q=e.target.value;lim=36;clearTimeout(qT);qT=setTimeout(drawGrid,130)};
  [['fb',v=>fb=v],['fs',v=>fs=v],['fc',v=>fc=v],['so',v=>so=v]].forEach(([i,f])=>$('#'+i).onchange=e=>{f(e.target.value);lim=36;drawGrid()});
  drawGrid()}
function found(){const k=nz(q).split(/\s+/).filter(Boolean);let L=live().filter(t=>(!fb||t.brand===fb)&&(!fs||t.size===fs)&&(!fc||t.color===fc)&&(!k.length||(x=>k.every(w=>x.includes(w)))(tx(t))));
  const p=t=>perM2(t)||sp(t)||1e15;
  if(so==='pa')L.sort((a,b)=>p(a)-p(b));else if(so==='pd')L.sort((a,b)=>(sp(b)?p(b):0)-(sp(a)?p(a):0));else if(so==='code')L.sort((a,b)=>a.code.localeCompare(b.code,'vi',{numeric:true}));else L.sort((a,b)=>(b.c||0)-(a.c||0));return L}
function drawGrid(){const g=$('#grid');if(!g)return;const L=found(),n=live().length;$('#cnt').textContent=n?L.length+' / '+n+' mẫu':'';
  g.style.display=L.length?'':'none';

  return(await(await gFetch(UP+(fid?'/'+fid:'')+'?uploadType=multipart&fields=id',{method:fid?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body})).json()).id}
async function imgDown(id){const b=await(await gFetch(API+'/'+id+'?alt=media')).blob();let u=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)});if(!/^data:image\//.test(u))u='data:image/webp;base64,'+u.slice(u.indexOf(',')+1);return u}
async function imgSync(){const F=await gFolder(),rem={};let pt='';
  do{const j=await(await gFetch(API+'?q='+encodeURIComponent("'"+F+"' in parents and trashed=false")+'&fields=nextPageToken,files(id,name)&pageSize=1000'+(pt?'&pageToken='+pt:''))).json();(j.files||[]).forEach(f=>rem[f.name]=f.id);pt=j.nextPageToken||''}while(pt);
  const left=[];let up=0;for(const id of pimg()){const t=tile(id),u=await full(id);if(!t||!u)continue;try{rem['gm_'+id]=await upImg(id,u,rem['gm_'+id],F);up++}catch(e){left.push(id);if(/Drive 40[13]|Failed to fetch/.test(e.message))throw e}}pimgSet(left);
  const need=live().filter(t=>t.ih&&rem['gm_'+t.id]&&!left.includes(t.id)&&IHL[t.id]!==t.ih);
  await pool(need,4,async t=>{const u=await imgDown(rem['gm_'+t.id]);setImg(t.id,u,await mkThumb(u).catch(()=>''),t.ih)});LS('gm_ilast',String(Date.now()));
  imgMsg=(need.length||up)?'Ảnh: tải về '+need.length+', đẩy lên '+up+'.':'';gUI();if(need.length)redraw()}

  try{LS('gm_hint',null);gTok=null;LS('gm_tok',null);await gToken();try{const u=(await(await gFetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json()).user;if(u&&u.emailAddress)LS('gm_hint',u.emailAddress)}catch(e){}
