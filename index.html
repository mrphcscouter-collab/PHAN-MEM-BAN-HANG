<title>Phần mềm bán hàng</title>
<style>
:root{--bg:#edf0f3;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#d9dee5;--ac:#0f766e;--acd:#0b5a54;--red:#b42318;--hd:#16212e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:24px;padding:0 20px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;padding:14px 0;font-weight:700;letter-spacing:.2px}
nav{display:flex;gap:2px}

nav{flex-wrap:wrap}nav button{padding:14px 10px;font-size:14px}
.void td{opacity:.55}.void td:first-child{text-decoration:line-through}.tag{display:inline-block;background:#fde8e6;color:var(--red);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600}
main{padding:18px 20px;max-width:1280px;margin:0 auto}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label input,label select{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
.pri,.ghost{border-radius:6px;padding:10px 16px;border:1px solid var(--ac);font-weight:600}
.pri{background:var(--ac);color:#fff}.pri:hover{background:var(--acd)}
.pri:disabled{background:#9db8b5;border-color:#9db8b5;cursor:not-allowed}
.ghost{background:#fff;color:var(--ac)}.ghost:hover{background:#f0f8f7}
.danger{color:var(--red);border-color:#e3b5b0}
.sell{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.tile{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:6px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:92px}
.tile:hover:not(:disabled){border-color:var(--ac);background:#f6fbfa}
.tile:disabled{opacity:.5;border-left-color:#aaa;cursor:not-allowed}
.tile span{color:var(--ac);font-weight:700}
small{color:var(--mute);font-size:12px}
#cart{position:sticky;top:12px;margin:0}
.line{display:grid;grid-template-columns:1fr auto 96px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.line b{display:block;font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:16px;line-height:1}
.qty span{min-width:20px;text-align:center}
.qb{display:contents}.qty .uu{order:5;margin-left:2px}.qty .ut{color:var(--mute);min-width:0}
.amt{text-align:right;font-weight:600}
.sum{margin-top:14px}
.row{display:flex;justify-content:space-between;padding:4px 0}
.row.big{font-size:19px;font-weight:700;color:var(--ac);padding:8px 0}
.act{display:flex;gap:10px;margin-top:12px}.act .pri{flex:1}
.empty{color:var(--mute);padding:14px 0}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto auto;gap:10px;align-items:end}
.form label{margin:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right}
td button{padding:5px 10px;font-size:13px;margin-left:4px}
.ivl{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ic{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.ic.void{background:#fafafa}.ic.void .ih,.ic.void .iit,.ic.void .ics{opacity:.55}.ic.void .ino{text-decoration:line-through}
.ih{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ino{font-size:16px;color:var(--ac)}.itot{font-size:18px}
.ics{font-size:14px}.im{font-size:13px;color:var(--mute)}.itg{display:flex;flex-wrap:wrap;gap:6px}
.tag.dbt{background:#fde8e6;color:var(--red)}.tag.rt{background:#fff4d6;color:#8a5a00}.tag.ed{background:#eaf0f6;color:#475467}
.iit{background:#f6f8fa;border-radius:8px;padding:6px 10px;font-size:14px}.iit>div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.iit>div+div{border-top:1px dashed var(--line)}.iit b{white-space:nowrap}
.upr.auto{background:#f6f8fa;color:#667085}
.iac{display:flex;gap:8px;margin-top:4px}.iac button{flex:1;padding:8px 4px;margin:0;white-space:nowrap}.ics a{color:var(--ac);font-weight:600;text-decoration:none}

.acts{display:flex;flex-wrap:nowrap;gap:4px;justify-content:flex-end}.acts button{margin:0;white-space:nowrap}td.act{white-space:nowrap;width:1%}
.rp{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:inherit;font:inherit}.rp:hover{border-color:var(--ac);background:#f0f8f7}.rp .r1{display:flex;justify-content:space-between;gap:10px;font-weight:700}.rp .r2{color:var(--mute);font-size:13px;margin-top:2px}.rp .r3{font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rsel{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f0f8f7;border:1px solid var(--ac);border-radius:8px;padding:10px 12px;margin:10px 0}
.hs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}.hs>div{flex:1 1 120px;background:#f6f8fa;border-radius:8px;padding:8px 12px}.hs b{display:block;font-size:17px}
.ptab td:first-child{min-width:210px}.ptab td:nth-child(2){min-width:84px}.ptab td:nth-child(3){min-width:72px}.ptab td.n,.ptab th.n{white-space:nowrap}
.clab{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}.cbox{position:relative;flex:1;min-width:0}.cbox input{width:100%}.cl{position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.15);margin-top:2px}.cl>div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.cl>div.on,.cl>div:hover{background:#e8f4f2}.cl>.more{color:var(--mute);font-size:13px;cursor:default}.cl>.more:hover{background:#fff}
.pact{white-space:nowrap}.pact button{min-height:34px;padding:4px 10px;margin:0 0 0 4px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
.stat b{display:block;font-size:22px;color:var(--ac);margin-top:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.low{color:var(--red);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 13px;color:var(--ink)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.qi{width:68px;padding:5px;text-align:center}
.pg{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:12px}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.fb input{flex:1;min-width:220px}.fb select{width:auto}
.row{align-items:center;gap:10px}
input[type=radio],input[type=checkbox]{width:auto;margin:0 6px 0 0}
.otabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ot{display:flex;background:#fff;border:1px solid var(--line);border-radius:6px}
.ot button{border:0;background:none;padding:8px 12px;color:var(--ink)}
.ot .x{padding:8px 10px;color:var(--mute);border-left:1px solid var(--line)}
.ot.on{border-color:var(--ac);background:#e8f4f2}.ot.on>button:first-child{color:var(--acd);font-weight:600}
.pos{display:grid;grid-template-columns:1fr 390px;gap:16px;align-items:start}
.lc{min-height:480px;margin:0}
.sb{display:flex;gap:10px;margin-bottom:12px}.sb select{width:190px}.sw{position:relative;flex:1}
.res{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(16,24,40,.16);z-index:5;max-height:380px;overflow:auto}
.ri{display:grid;grid-template-columns:84px 1fr auto 74px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ri.on,.ri:hover{background:#eef8f6}.ri .cd{color:var(--mute);font-size:12px}.ri b{display:block;font-weight:600}
.lt .qty{justify-content:flex-end}.pi{width:116px;padding:6px 8px;text-align:right}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1}.lt .x:hover{color:var(--red)}
.emp{padding:70px 20px;text-align:center;color:var(--mute)}
.pp{position:sticky;top:12px;margin:0}
.ri2{width:150px;text-align:right}
.chk{display:flex;align-items:center;color:var(--ink);font-size:14px;margin:8px 0}
.pm{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px}.pm label{display:flex;align-items:center;margin:0;color:var(--ink);font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.quick button{border:1px solid var(--line);background:#f4f6f8;border-radius:6px;padding:6px 10px}.quick button:hover{border-color:var(--ac)}
.paybtn{width:100%;font-size:17px;padding:14px;margin-top:10px}
.keys{margin:8px 2px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
@media(max-width:900px){.pos{grid-template-columns:1fr}.pp{position:static}.sb{flex-direction:column}.sb select{width:100%}}
#rc{display:none}
.cinfo{background:#f4f8f7;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:-4px 0 10px;font-size:13px}
.qc{border:1px dashed var(--ac);border-radius:8px;padding:10px;margin:0 0 10px;display:grid;gap:8px}
@media print{html,body{background:#fff!important}body>*:not(#rc){display:none!important}
 #rc{display:block;color:#000}
 #rc.k80{width:76mm;font:12px/1.4 monospace;margin:0 auto}
 #rc h3{text-align:center;margin:0 0 4px;font-size:15px}#rc .r{display:flex;justify-content:space-between;gap:8px}
 #rc hr{border:0;border-top:1px dashed #000}#rc .c{text-align:center}
 .doc:not(.k80){font:13px/1.45 "Segoe UI",Arial,sans-serif}
 .doc .dh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
 .doc .dshop b{font-size:1.2em;text-transform:uppercase}.doc .dtt{text-align:right;white-space:nowrap}.doc .dt{font-size:1.6em;font-weight:700;letter-spacing:.5px}
 .doc .dp{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin:6px 0 10px}.doc .dp span{color:#333}
 .doc .dtb{width:100%;border-collapse:collapse}.doc .dtb th,.doc .dtb td{border:1px solid #000;padding:3px 6px;vertical-align:top}.doc .dtb th{background:#eee;font-weight:700}
 .doc thead{display:table-header-group}.doc tr{page-break-inside:avoid}.doc small{color:#333}
 .doc .dbt{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:8px;align-items:start}.doc .dsum{width:100%}.doc .dsum div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}.doc .dsum .b{font-weight:700;font-size:1.1em;border-top:1px solid #000;padding-top:4px}
 .doc .dw{margin:8px 0}.doc .dsg{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:12px;page-break-inside:avoid}.doc .dsg div{min-height:74px}.doc .dsg i{display:block;font-size:.85em;color:#444}
 .doc .dft{text-align:center;margin-top:8px;font-size:.9em}
 .doc.a5,.doc.a5l{font-size:10.5px;line-height:1.35}.doc.a5 .dt,.doc.a5l .dt{font-size:1.35em}.doc.a5 .dh,.doc.a5l .dh{padding-bottom:5px;margin-bottom:5px}.doc.a5 .dp,.doc.a5l .dp{margin:4px 0 6px}.doc.a5 .dtb th,.doc.a5 .dtb td,.doc.a5l .dtb th,.doc.a5l .dtb td{padding:2px 5px}.doc.a5 .dsg,.doc.a5l .dsg{margin-top:6px}.doc.a5 .dsg div,.doc.a5l .dsg div{min-height:40px}.doc.a5 .dft,.doc.a5l .dft{margin-top:4px}
}
@media(max-width:900px){.sell{grid-template-columns:1fr}#cart{position:static}.form{grid-template-columns:1fr 1fr}}
html{-webkit-text-size-adjust:100%}
#syncbtn{margin-left:auto;border:1px solid #3a4c61;background:transparent;color:#cfd8e3;border-radius:16px;padding:5px 12px;font-size:13px;white-space:nowrap}
#syncbtn.s-ok{color:#5eead4;border-color:#2a7f76}#syncbtn.s-busy{color:#93c5fd}#syncbtn.s-dirty,#syncbtn.s-offline{color:#fbbf24;border-color:#8a6a10}#syncbtn.s-auth,#syncbtn.s-err{color:#fff;background:#b42318;border-color:#b42318}
details{margin-top:10px}summary{cursor:pointer;color:var(--ac);font-weight:600}code{background:#f0f2f5;padding:1px 5px;border-radius:4px}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
#mbar{display:none}
@media(max-width:700px){
header{position:sticky;top:0;z-index:15;padding:calc(6px + env(safe-area-inset-top)) 14px 6px;gap:0}

input,select{font-size:16px}
button{min-height:40px}

/* ===== LỚP THIẾT KẾ MỚI (ghi đè, không đổi logic) ===== */
:root{--bg:#f3f5f7;--ink:#14202b;--mute:#5f6c7b;--line:#e1e6ec;--ac:#0f766e;--acd:#0a5c56;--acl:#e6f4f2;--red:#b42318;--hd:#101a24;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05)}
body{font:15px/1.5 "Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;background:var(--bg)}
::selection{background:#b8e6e0}
*{scrollbar-width:thin;scrollbar-color:#c3ccd6 transparent}
header{background:linear-gradient(180deg,#14212d,#0e1822);gap:14px;padding:0 18px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 10px rgba(0,0,0,.18);position:sticky;top:0;z-index:30}
header h1{font-size:15px;font-weight:700;letter-spacing:.3px;padding:12px 0;color:#e9f1f7;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{gap:2px;align-items:center}
nav button{border:0;border-radius:8px;margin:7px 0;padding:8px 12px;font-size:14px;font-weight:500;color:#9fb0c2;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:#0f766e;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(15,118,110,.45)}
nav button[data-tab=sell]{font-weight:700}
nav button[data-tab=products],nav button[data-tab=customers],nav button[data-tab=expenses],nav button[data-tab=settings]{margin-left:14px;position:relative}
nav button[data-tab=products]::before,nav button[data-tab=customers]::before,nav button[data-tab=expenses]::before,nav button[data-tab=settings]::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:1px;background:rgba(255,255,255,.13)}
main{padding:18px 20px 40px}
.card{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
h2{font-size:17px;font-weight:700;letter-spacing:.1px;margin:0 0 14px}
input,select{border:1px solid #cfd6df;border-radius:9px;padding:10px 12px;transition:border-color .15s,box-shadow .15s;min-height:42px}
input:hover,select:hover{border-color:#aab5c2}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{font-weight:500}
.pri,.ghost{border-radius:9px;min-height:42px;transition:background .15s,box-shadow .15s,transform .05s}
.pri{box-shadow:0 1px 2px rgba(15,118,110,.4)}
.pri:active,.ghost:active{transform:translateY(1px)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#6b7788;background:#f8fafb;position:sticky;top:0}
td,th{padding:11px 10px}
@media(min-width:701px){table tr:hover>td{background:#fafcfc}}
.stat{border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}.stat b{font-size:24px;letter-spacing:-.3px}
.tile{border-radius:10px;box-shadow:var(--sh)}
.chips button.on{box-shadow:0 2px 6px rgba(15,118,110,.3)}
#toast{background:#101a24;border-radius:12px;padding:12px 20px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-weight:500;z-index:60}

/* ----- Màn hình bán hàng ----- */
.pos{grid-template-columns:minmax(0,1fr) 410px;gap:18px}

function debtRem(v){return Math.max(0,Math.round(((v.debt||0)-(v.debtCut||0)-(v.debtPaid||0))*100)/100)}
/* Phân bổ tiền thu nợ vào các hóa đơn còn nợ của khách, cũ nhất trước */
function allocDebt(cid,amt){
  const out=[];let left=amt;
  db.invoices.filter(v=>v.cid===cid&&!v.void&&debtRem(v)>0).sort((a,b)=>a.time-b.time).forEach(v=>{
    if(left<=0.005)return;const t=Math.min(debtRem(v),left);v.debtPaid=Math.round(((v.debtPaid||0)+t)*100)/100;left=Math.round((left-t)*100)/100;out.push([v.no,t])});

}

  const SP=db.spays.filter(x=>x.time>=R.t0&&x.time<R.t1&&!x.void),PY=db.pays.filter(x=>x.time>=R.t0&&x.time<R.t1);
  const cin=S(C.L,v=>v.total-(v.debt||0))+S(PY,x=>x.amt)-S(C.RT,r=>r.total-(r.cut||0)),cout=C.exp+S(IM,x=>x.paid||0)+S(SP,x=>x.amt);
  Object.assign(A,{IM,bySup,imTot:S(IM,x=>x.total),cin,cout,payIn:S(PY,x=>x.amt),spOut:S(SP,x=>x.amt),imPaid:S(IM,x=>x.paid||0)});

   slowR=A.stk>0?A.slow90.reduce((s,p)=>s+p.stock*(p.cost||0),0)/A.stk*100:0,outR=A.act.length?A.out.length/A.act.length*100:0;

  else ST.push(['Lợi nhuận và giá bán',[`Biên lãi gộp ${nf(mg)}% ở mức ${mg>=18?'tốt':'chấp nhận được'}. Giữ vững và tăng lãi tuyệt đối bằng cách tăng giá trị mỗi đơn (hiện ${money(C.avg)}/đơn) qua bán kèm và combo theo công trình.`,'Dùng bảng giá thợ cho khách mua số lượng lớn để giữ khách nhưng vẫn kiểm soát biên lãi.']]);

function rebalDebt(list,total){
  const r2=x=>Math.round(x*100)/100,L=list.filter(v=>!v.void).sort((a,b)=>a.time-b.time);
  let ex=r2(L.reduce((t,v)=>t+debtRem(v),0)-(total||0));
  if(ex>0.005){for(const v of L){if(ex<=0.005)break;const t=Math.min(debtRem(v),ex);v.debtPaid=r2((v.debtPaid||0)+t);ex=r2(ex-t)}}
  else if(ex<-0.005){let need=-ex;for(const v of L.slice().reverse()){if(need<=0.005)break;const t=Math.min(v.debtPaid||0,need);if(t>0){v.debtPaid=r2(v.debtPaid-t);need=r2(need-t)}}}
}

    old.items.forEach(it=>{const p=prod(it.id);p.stock=rd(p.stock-it.qty);mv(p,'Sửa phiếu nhập (trừ bản cũ)',-it.qty,'',old.no,{alloc:[[bk(old.wid||db.defWh,old.lid||''),-it.qty]]})});
  }
  const no=old?old.no:'PN'+String(db.seqPN++).padStart(4,'0');
  const items=L.map(l=>{const p=prod(l.id),b=Math.max(0,p.stock);if(upc)p.cost=b+l.qty>0?Math.round((b*(p.cost||0)+l.qty*l.cost)/(b+l.qty)):l.cost;p.stock=rd(p.stock+l.qty);mv(p,old?'Nhập (sau khi sửa phiếu)':'Nhập',l.qty,s?s.name:'',no,{wid:w,lid:lc});const ur=urates(p),uu=ur[l.u||0]||ur[0];return{id:p.id,name:p.name,unit:p.unit,qty:l.qty,cost:l.cost,...(uu.rate!==1?{un:uu.name,uq:rd6(l.qty/uu.rate)}:{})}});
  const rec={no,time:T.t,sid:s?s.id:'',sname:s?s.name:'',items,total:items.reduce((t,i)=>t+i.qty*i.cost,0),wid:w,lid:lc,note:imp.note.trim(),paid:Math.round(pd),debt:Math.max(0,Math.round(tot-pd))};
  rec.debtPaid=(old&&old.sid===rec.sid&&old.debtPaid>0&&rec.debt>0)?Math.min(old.debtPaid,rec.debt):0; /* giữ phần nợ đã trả */
  if(s&&rec.debt)s.debt=(s.debt||0)+rec.debt-rec.debtPaid;
  if(old)Object.assign(old,rec,{edited:Date.now()});else db.imports.unshift(rec);
  db.imports.sort((a,b)=>b.time-a.time);
  imp={sid:'',note:'',lines:[]};save();impView();toast((old?'Đã lưu thay đổi phiếu ':'Đã lưu phiếu nhập ')+no);
}

function voidImport(no){
  const x=db.imports.find(z=>z.no===no);if(!x||x.void)return;
  const w=x.wid||db.defWh,l=x.lid||'';
  for(const it of x.items){const p=prod(it.id);if(!p)continue;
    if(!db.allowNeg&&(balOf(p,w,l)-it.qty<0||p.stock-it.qty<0))return alert(`Không hủy được: "${p.name}" đã được bán hoặc chuyển đi nên tồn kho không đủ để trừ lại phiếu nhập này.`)}
  if(!confirm(`Hủy phiếu nhập ${no}? Hàng của phiếu được trừ khỏi kho. Phiếu vẫn được giữ trong lịch sử với trạng thái Đã hủy.\n\nLưu ý: giá vốn bình quân của sản phẩm đã được cập nhật lúc nhập sẽ không tự tính lại; nếu cần hãy chỉnh giá vốn ở thẻ Sản phẩm.`))return;
  x.items.forEach(it=>{const p=prod(it.id);if(p){p.stock=rd(p.stock-it.qty);mv(p,'Hủy phiếu nhập',-it.qty,x.sname||'',x.no,{alloc:[[bk(w,l),-it.qty]]})}});
  {const sp=db.suppliers.find(z=>z.id===x.sid);if(sp&&debtRem(x)>0)sp.debt=Math.max(0,(sp.debt||0)-debtRem(x))}
  x.void=true;x.voidTime=Date.now();save();impView();toast('Đã hủy phiếu nhập '+no);
}

function saveRet(){
  const v=db.invoices.find(x=>x.no===retNo&&!x.void);if(!v)return;
  const X=retEdit?db.returns.find(z=>z.no===retEdit):null,oq=i=>{if(!X)return 0;const k=v.items.indexOf(i),it=X.items.find(z=>z.k!=null?z.k===k:z.id===i.id);return it?it.qty:0};
  const r=v.sub?(v.total-(v.fee||0))/v.sub:1,L=[];
  document.querySelectorAll('.rq').forEach(el=>{const k=+el.dataset.ri,i=v.items[k],q=Math.min(rd((+el.value||0)*ri(i)),rd(i.qty-((i.ret||0)-oq(i))));if(q>0)L.push([k,q])});
  if(!L.length)return alert('Nhập số lượng trả cho ít nhất một sản phẩm.');
  const T=timeIn($('#rtime').value,X?X.time:Date.now());if(T.err)return alert(T.err);
  if(T.t<v.time)return alert('Thời gian trả hàng không được trước thời gian lập hóa đơn ('+fmtT(v.time)+').');
  if(X){ /* sửa phiếu: kiểm tra rồi hoàn bản cũ (tồn, số lượng đã trả, công nợ) */
    for(const it of X.items){const p=prod(it.id),nq=L.filter(([k])=>v.items[k].id===it.id).reduce((t,[,q])=>t+q,0);if(p&&!db.allowNeg&&p.stock-it.qty+nq<0)return alert(`Không sửa được: sau khi trừ phiếu trả cũ, "${p.name}" sẽ bị âm tồn vì hàng trả đã được bán lại.`)}
    X.items.forEach(it=>{const vi=it.k!=null?v.items[it.k]:v.items.find(z=>z.id===it.id),p=prod(it.id);if(vi)vi.ret=rd((vi.ret||0)-it.qty);if(p){p.stock=rd(p.stock-it.qty);mv(p,'Sửa phiếu trả (trừ bản cũ)',-it.qty,X.no,X.no,it.alloc?{alloc:it.alloc.map(([k,q])=>[k,-q])}:{})}});
    const c0=db.customers.find(x=>x.id===v.cid);if(c0&&X.cut){c0.debt=(c0.debt||0)+X.cut;v.debtCut=Math.max(0,(v.debtCut||0)-X.cut)}
  }
  const no=X?X.no:'TH'+String(db.seqTH++).padStart(4,'0');
  const items=L.map(([k,q])=>{const i=v.items[k],p=prod(i.id);let al;i.ret=rd((i.ret||0)+q);if(p){p.stock=rd(p.stock+q);mv(p,X?'Trả hàng (sau khi sửa phiếu)':'Trả hàng',q,no+' ('+v.no+')',no);al=db.moves[0].alloc}return{k,id:i.id,name:i.name,unit:i.unit,cat:i.cat,qty:q,price:i.price,cost:i.cost||0,alloc:al,...(i.note?{note:i.note}:{}),...(i.un&&i.uq>0?{un:i.un,uq:rd6(q/ri(i))}:{})}});
  const total=Math.round(items.reduce((t,i)=>t+i.qty*i.price,0)*r),c=db.customers.find(x=>x.id===v.cid);let cut=0;
  if(c&&debtRem(v)>0){cut=Math.max(0,Math.min(total,c.debt||0,debtRem(v)));c.debt-=cut;v.debtCut=(v.debtCut||0)+cut}
  const rec={no,time:T.t,inv:v.no,cname:v.cname,items,total,cut,note:$('#rnote').value.trim()};
  if(X)Object.assign(X,rec,{edited:Date.now()});else db.returns.unshift(rec);
  db.returns.sort((a,b)=>b.time-a.time);
  save();retNo='';retEdit=null;retTime='';retView();toast(`${X?'Đã lưu thay đổi':'Đã lưu'} ${no}, hoàn khách ${money(total-cut)}`);
}

function vnWords(n){
  n=Math.round(Math.abs(n));if(!n)return 'không';
  const d=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],U=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'];
  const three=(x,full)=>{const t=Math.floor(x/100),c=Math.floor(x/10)%10,u=x%10;let r='';
    if(t>0||full)r+=d[t]+' trăm';
    if(c>1){r+=' '+d[c]+' mươi';if(u===1)r+=' mốt';else if(u===4)r+=' tư';else if(u===5)r+=' lăm';else if(u>0)r+=' '+d[u]}
    else if(c===1){r+=' mười';if(u===5)r+=' lăm';else if(u>0)r+=' '+d[u]}
    else if(u>0){if(t>0||full)r+=' lẻ';r+=' '+d[u]}
    return r.trim()};
  const g=[];let m=n;while(m>0){g.push(m%1000);m=Math.floor(m/1000)}
  const out=[];for(let i=g.length-1;i>=0;i--){if(!g[i])continue;out.push(three(g[i],i<g.length-1)+(U[i]?' '+U[i]:''))}
  return out.join(' ');
}

/* Dữ liệu lưu thành 1 file JSON trong Drive của người dùng. Mỗi máy vẫn giữ bản sao trong IndexedDB để chạy offline. */
const GCID_DEFAULT=''; /* có thể dán OAuth Client ID vào đây để khỏi nhập trên từng điện thoại */
const GSCOPE='https://www.googleapis.com/auth/drive.file',GFILE='BanHang_DuLieu.json';
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
let booting=true,gTok=null,gExp=0,gBusy=false,gState='off',gMsg='',gPushT=0,gSeq=0,gLibP=null;
const gCid=()=>(LS('bh_gcid')||GCID_DEFAULT||'').trim();
const gOn=()=>LS('bh_gon')==='1';
const gDirtyF=()=>LS('bh_gdirty')==='1';
const gValid=()=>!!gTok&&gExp>Date.now()+60000;
function gDirty(){if(booting||!gOn())return;gSeq++;LS('bh_gdirty','1');gSched();gUI()}
function gSched(){clearTimeout(gPushT);gPushT=setTimeout(()=>gSync(),1500)}
function gSet(s,m){gState=s;gMsg=m||'';gUI()}
function gStatusText(){
  if(!gOn())return 'Chưa kết nối.';
  const d=gDirtyF()&&gState==='ok'?' Có thay đổi đang chờ đẩy lên Drive.':'';
  return (gMsg||'Đã kết nối.')+d;
}
function gUI(){
  const b=$('#syncbtn');
  if(b){
    const s=!gOn()?'off':(gState==='ok'&&gDirtyF()?'dirty':gState);
    const T={off:'☁ Chưa đồng bộ',ok:'☁ Đã đồng bộ',busy:'☁ Đang đồng bộ…',dirty:'☁ Chờ đồng bộ',auth:'☁ Đăng nhập lại',err:'☁ Lỗi đồng bộ',offline:'☁ Offline'};
    b.textContent=T[s]||T.off;b.className='s-'+s;b.title=gStatusText();
  }
  const st=$('#gstat');if(st)st.innerHTML='<b>Trạng thái:</b> '+esc(gStatusText());
}
function gLib(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  return gLibP||(gLibP=new Promise((ok,no)=>{
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;
    s.onerror=()=>{gLibP=null;no(Object.assign(new Error('Không tải được thư viện đăng nhập Google. Hãy kiểm tra kết nối Internet.'),{net:true}))};
    document.head.appendChild(s);
  }));
}
function gLoadTok(){try{const t=JSON.parse(LS('bh_gtok'));if(t&&t.exp>Date.now()+60000){gTok=t.t;gExp=t.exp}}catch(e){}}
async function gToken(){
  if(gValid())return gTok;
  if(!gCid())throw Object.assign(new Error('Chưa nhập Client ID Google.'),{auth:true});
  await gLib();
  return new Promise((ok,no)=>{
    const hint=LS('bh_ghint')||undefined;
    const c=google.accounts.oauth2.initTokenClient({client_id:gCid(),scope:GSCOPE,hint,
      callback:r=>{
        if(r.error)return no(Object.assign(new Error(r.error_description||r.error),{auth:true}));
        gTok=r.access_token;gExp=Date.now()+(+r.expires_in||3600)*1000;LS('bh_gtok',JSON.stringify({t:gTok,exp:gExp}));ok(gTok);
      },
      error_callback:e=>no(Object.assign(new Error(e&&e.type==='popup_closed'?'Đã đóng cửa sổ đăng nhập Google.':'Không mở được cửa sổ đăng nhập Google (trình duyệt có thể đang chặn cửa sổ bật lên).'),{auth:true}))});
    c.requestAccessToken({prompt:hint?'':'select_account'});
  });
}
async function gFetch(url,opt={},retry=true){
  const t=await gToken();
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
  if(r.status===401&&retry){gTok=null;LS('bh_gtok',null);return gFetch(url,opt,false)}
  if(!r.ok){const x=await r.text().catch(()=>'');throw new Error('Drive '+r.status+': '+x.slice(0,200))}
  return r;
}
async function gFind(){
  const q=encodeURIComponent(`name='${GFILE}' and trashed=false`),o=encodeURIComponent('modifiedTime desc');
  const r=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=${o}&fields=files(id,version,modifiedTime)&pageSize=10`);
  return((await r.json()).files||[])[0]||null;
}
const gMeta=async id=>(await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?fields=id,version,modifiedTime,trashed`)).json();
const gDown=async id=>(await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();
async function gUp(id,body){
  if(id){
    const r=await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id,version`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    return r.json();
  }
  const bd='bhsync'+uid(),meta=JSON.stringify({name:GFILE,mimeType:'application/json'});
  const mb=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
  const r=await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,version',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mb});
  return r.json();
}
async function gPush(id){
  const seq=gSeq,body=JSON.stringify(db),r=await gUp(id,body);
  LS('bh_gfid',r.id);LS('bh_gver',String(r.version));
  if(idb)await idbPut('base',JSON.parse(body)).catch(()=>{}); /* bản gốc để gộp ở lần sau */
  if(seq===gSeq)LS('bh_gdirty','0');
}
function gApply(d){
  if(!d||!d.products||!d.invoices)throw new Error('File trên Drive không đúng định dạng dữ liệu bán hàng.');
  const before=JSON.stringify(db);db=d;norm();
  orders.forEach(o=>{o.lines=o.lines.filter(i=>prod(i.id));if(o.cid&&!db.customers.some(c=>c.id===o.cid))o.cid=''});
  cur=Math.min(cur,orders.length-1);
  if(idb){try{idb.transaction('kv','readwrite').objectStore('kv').put(db,'db')}catch(e){}}
  else{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
  $('#shopname').textContent=db.shop;
  const ae=document.activeElement;
  const formOpen=(tab==='products'&&(pAddOpen||editing||(typeof cloneFrom!=='undefined'&&cloneFrom)))||(tab==='customers'&&(editC||($('#cn')&&$('#cn').value.trim())));

/*MERGE_START*/
const jeq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const idbPut=(k,v)=>new Promise((ok,no)=>{const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});
function normObj(o){const k=db;db=o;try{norm()}finally{db=k}return o}
const GCOLS=[['products',x=>x.id],['customers',x=>x.id],['suppliers',x=>x.id],['whs',x=>x.id],['locs',x=>x.id],['attrs',x=>x.id],['staff',x=>x.id],['expenses',x=>x.id],['counts',x=>x.id],['moves',x=>x.id],['invoices',x=>x.no],['spays',x=>x.id],['imports',x=>x.no],['returns',x=>x.no],['xfers',x=>x.no],['pays',x=>x.time+'|'+x.cid+'|'+x.amt],['spays',x=>x.time+'|'+x.sid+'|'+x.amt]];
const GSEQ=['seq','seqPN','seqTH','seqKK','seqCK','seqTN','seqPT'];
/* gộp 1 bản ghi: tồn kho và công nợ cộng dồn chênh lệch, các trường khác lấy bên có thay đổi (cùng sửa một trường thì lấy máy này) */
function gRec(b,l,r){
  const o={};
  new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
    let v;
    if(k==='stock'||k==='debt')v=rd((r[k]||0)+(l[k]||0)-(b[k]||0));
    else if(k==='bal'){v={};const B=b.bal||{},L=l.bal||{},R=r.bal||{};new Set([...Object.keys(L),...Object.keys(R)]).forEach(x=>{const n=rd((R[x]||0)+(L[x]||0)-(B[x]||0));if(n)v[x]=n})}
    else v=jeq(l[k],b[k])?r[k]:l[k];
    if(v!==undefined)o[k]=v;
  });
  return o;
}
/* phiếu do máy này lập trùng số với phiếu máy kia lập: đổi số phiếu của máy này, sửa các tham chiếu */
function gRenum(B,L,R){
  const map={};
  [['invoices','seq'],['pays','seqPT'],['spays','seqTN'],['imports','seqPN'],['returns','seqTH'],['xfers','seqCK'],['counts','seqKK']].forEach(([c,sf])=>{
    const bn=new Set(B[c].map(x=>x.no)),rn=new Set(R[c].map(x=>x.no)),used=new Set([...L[c].map(x=>x.no),...rn]);
    let seq=Math.max(L[sf]||1,R[sf]||1);
    L[c].filter(x=>x.no&&!bn.has(x.no)&&rn.has(x.no)).sort((a,b)=>a.time-b.time).forEach(x=>{
      const pre=x.no.replace(/\d+$/,'');let n;
      do{n=pre+String(seq++).padStart(4,'0')}while(used.has(n));
      used.add(n);map[x.no]=n;x.no=n;
    });
    L[sf]=Math.max(seq,L[sf]||1);
  });
  if(Object.keys(map).length){
    L.moves.forEach(m=>{if(map[m.ref])m.ref=map[m.ref];if(m.note)m.note=m.note.replace(/[A-Za-z]{1,6}\d{4,}/g,s=>map[s]||s)});
    L.returns.forEach(r=>{if(map[r.inv])r.inv=map[r.inv]});
  }
  return map;
}
let gRenMap={};
function gMerge(B,L,R){
  gRenMap=gRenum(B,L,R);
  const M={},cn=GCOLS.map(c=>c[0]);
  new Set([...Object.keys(L),...Object.keys(R)]).forEach(k=>{
    if(cn.includes(k))return;
    let v;
    if(GSEQ.includes(k))v=Math.max(L[k]||1,R[k]||1);
    else if(k==='cats'){const bs=new Set(B.cats||[]),ls=new Set(L.cats||[]),rs=new Set(R.cats||[]);v=[...new Set([...(R.cats||[]),...(L.cats||[])])].filter(x=>!(bs.has(x)&&(!ls.has(x)||!rs.has(x))))}
    else v=jeq(L[k],B[k])?R[k]:L[k];
    if(v!==undefined)M[k]=v;
  });
  GCOLS.forEach(([c,kf])=>{
    const idx=a=>{const m=new Map();(a||[]).forEach(x=>m.set(kf(x),x));return m};
    const b=idx(B[c]),l=idx(L[c]),r=idx(R[c]),out=[];
    new Set([...r.keys(),...l.keys()]).forEach(k=>{
      const bv=b.get(k),lv=l.get(k),rv=r.get(k);let v=null;
      if(bv===undefined)v=rv!==undefined?rv:lv;
      else if(lv&&rv)v=gRec(bv,lv,rv);
      else if(rv)v=jeq(rv,bv)?null:rv;      /* máy này xóa, máy kia không đụng tới -> xóa */
      else if(lv)v=jeq(lv,bv)?null:lv;
      if(v)out.push(v);
    });
    M[c]=out;
  });
  const pid=new Set(M.products.map(p=>p.id));
  M.moves=M.moves.filter(m=>pid.has(m.pid));
  ['invoices','imports','returns','xfers','counts','moves','pays','expenses','spays'].forEach(c=>M[c].sort((a,b)=>(b.time||0)-(a.time||0)));
  M.ver=5;
  return M;
}
/*MERGE_END*/
async function gMergePush(id,base){
  for(let t=0;t<3;t++){
    flush();
    const m=await gMeta(id),rem=await gDown(id);
    if(!rem||!rem.products||!rem.invoices)throw new Error('File trên Drive không đúng định dạng dữ liệu bán hàng.');
    normObj(rem);
    const copy=o=>JSON.parse(JSON.stringify(o)),remC=copy(rem);
    const M=gMerge(normObj(copy(base)),copy(db),rem);
    if(idb)await idbPut('premerge',db).catch(()=>{});
    gApply(M);LS('bh_gver',String(m.version));gSeq++;LS('bh_gdirty','1');
    const m2=await gMeta(id);
    if(m2.version!==m.version){base=remC;continue} /* máy khác vừa đẩy thêm: gộp lại */
    await gPush(id);
    const ren=Object.entries(gRenMap);
    if(ren.length)alert('Hai máy cùng lập phiếu trùng số. Phiếu lập trên máy này đã được tự đổi số:\n'+ren.map(([a,b])=>a+' → '+b).join('\n')+'\n\nNếu đã in phiếu cũ cho khách, hãy lưu ý số mới.');
    else toast('Đã tự động gộp dữ liệu từ máy khác');
    return;
  }
  throw new Error('Dữ liệu trên Drive thay đổi liên tục, hãy thử đồng bộ lại.');
}
async function gSync(o={}){
  if(gBusy||!gOn())return;
  if(!navigator.onLine){gSet('offline','Đang offline. Dữ liệu lưu trên máy, sẽ tự đồng bộ khi có mạng.');return}
  if(!gValid()&&!o.interactive){gSet('auth','Phiên đăng nhập Google đã hết hạn. Bấm nút ☁ trên đầu trang để đăng nhập lại. Dữ liệu vẫn được lưu trên máy.');return}
  gBusy=true;gSet('busy','Đang đồng bộ…');let ok=false;
  try{
    flush();
    let id=LS('bh_gfid'),base=LS('bh_gver'),meta=null;
    if(id){try{meta=await gMeta(id);if(meta.trashed)meta=null}catch(e){if(/Drive 404/.test(e.message))meta=null;else throw e}}
    if(!meta){
      LS('bh_gfid',null);LS('bh_gver',null);
      const f=await gFind();
      if(!f)await gPush(null);
      else if(o.force==='push')await gPush(f.id);
      else if(o.force==='pull'||confirm('Trên Google Drive đã có dữ liệu bán hàng.\n\nOK = lấy dữ liệu từ Drive về máy này (dữ liệu hiện có trên máy này sẽ bị thay thế).\nHủy = không kết nối.'))await gPullTo(f.id);
      else{LS('bh_gon',null);gSet('off','');return}
    }else{
      const dirty=gDirtyF();
      let act=o.force||(meta.version===base?(dirty?'push':'none'):(dirty?'conflict':'pull'));
      if(act==='conflict'){
        const bs=idb?await idbGet('base').catch(()=>null):null;
        if(bs&&bs.products){await gMergePush(id,bs);act='done'}
      }
      if(act==='conflict'){
        act=confirm('Dữ liệu trên Google Drive đã được thay đổi từ máy khác, trong khi máy này cũng có thay đổi chưa đồng bộ.\n\nOK = lấy dữ liệu từ Drive (thay đổi chưa đồng bộ của máy này bị bỏ).\nHủy = giữ dữ liệu máy này và ghi đè lên Drive.\n\nBản bị bỏ sẽ được tự tải về dưới dạng file sao lưu.')?'pull':'push';
        if(act==='pull')await dl('sao-luu-may-nay-'+stamp()+'.json',JSON.stringify(db),'application/json');
        else{const rem=await gDown(id);await dl('sao-luu-drive-'+stamp()+'.json',JSON.stringify(rem),'application/json')}
      }
      if(act==='pull')await gPullTo(id);else if(act==='push')await gPush(id);
    }
    ok=true;gSet('ok','Đã đồng bộ lúc '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})+'.');
    if(o.manual)toast('Đã đồng bộ với Google Drive');
  }catch(e){
    const msg=e.message||String(e);
    gSet(e.auth||/Drive 40[13]/.test(msg)?'auth':(e.net||/Failed to fetch|NetworkError/i.test(msg)?'offline':'err'),msg);
    if(o.manual)alert('Đồng bộ chưa thành công: '+msg);
  }finally{
    gBusy=false;gUI();
    if(ok&&gDirtyF())gSched();
  }
}

const QRG=(()=>{

  const fmt=m=>{const d=(0<<3)|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;

async function idbFix(){ /* máy đã dùng bản trước (DB v2): đưa về v1 để quay lại phần mềm cũ không lỗi */
  if(idb.version<=1)return;
  const rd=async n=>{if(!idb.objectStoreNames.contains(n))return[[],[]];const s=idb.transaction(n).objectStore(n);return[await idbReq(s.getAllKeys()),await idbReq(s.getAll())]};
  const [kk,kv]=await rd('kv'),[ik,iv]=await rd('img');
  const open=(name,ver,up)=>new Promise((ok,no)=>{const r=ver?indexedDB.open(name,ver):indexedDB.open(name);r.onupgradeneeded=()=>up&&up(r.result);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  const put=async(d,pairs)=>{const tx=d.transaction('kv','readwrite'),s=tx.objectStore('kv');pairs.forEach(([k,v])=>s.put(v,k));await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})};
  const all=[...kk.map((k,i)=>[k,kv[i]]),...ik.map((k,i)=>['img:'+k,iv[i]])];
  const dropDb=n=>new Promise(ok=>{const r=indexedDB.deleteDatabase(n);r.onsuccess=ok;r.onerror=ok;r.onblocked=()=>ok('blocked')});
  await dropDb('ban_hang_tmp');const tmp=await open('ban_hang_tmp',1,d=>d.createObjectStore('kv'));await put(tmp,all);
  if((await idbReq(tmp.transaction('kv').objectStore('kv').getAllKeys())).length!==all.length){tmp.close();throw new Error('copy')}
  const old=idb;old.close();
  if(await dropDb('ban_hang_db')==='blocked'){idb=await open('ban_hang_db');tmp.close();return}
  const nu=await open('ban_hang_db',1,d=>d.createObjectStore('kv'));await put(nu,all);
  if((await idbReq(nu.transaction('kv').objectStore('kv').getAllKeys())).length===all.length){idb=nu;tmp.close();await dropDb('ban_hang_tmp')}
  else{idb=nu;tmp.close()}
}

/* ---- Đồng bộ ảnh qua Google Drive: mỗi ảnh một file nhỏ bh_img_<mã sản phẩm> ---- */
let imgBusy=false,imgMsg='';
const IMGINT=5*60*1000,imgH=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+s.length.toString(36)};
const imgFile='bh_img_',IMGDIR='BanHang_HinhAnh';
async function imgList(){const out=[];let pt='';do{const q=encodeURIComponent(`name contains '${imgFile}' and trashed=false`),r=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,appProperties,parents)&pageSize=1000${pt?'&pageToken='+pt:''}`),j=await r.json();out.push(...(j.files||[]));pt=j.nextPageToken||''}while(pt);return out}
async function imgFolder(){ /* thư mục chứa ảnh; nhiều máy cùng tạo thì mọi máy chọn thư mục cũ nhất */
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+IMGDIR+"' and trashed=false");
  const j=await (await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id)&pageSize=10`)).json();
  if(j.files&&j.files[0])return j.files[0].id;
  const r=await gFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:IMGDIR,mimeType:'application/vnd.google-apps.folder'})});
  return (await r.json()).id}
async function imgUp(pid,u,fid,h,par){
  const mime=u.slice(5,u.indexOf(';')),bin=atob(u.slice(u.indexOf(',')+1)),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  const bd='bhimg'+uid(),pn=(db.products.find(x=>ik(x)===pid)||{}).name||'',meta=JSON.stringify(Object.assign({name:imgFile+pid,mimeType:mime,description:pn,appProperties:{h}},fid?{}:{parents:[par]}));
  const body=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: ${mime}\r\n\r\n`,arr,`\r\n--${bd}--`]);
  const r=await gFetch(`https://www.googleapis.com/upload/drive/v3/files${fid?'/'+fid:''}?uploadType=multipart&fields=id`,{method:fid?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body});
  return (await r.json()).id}
async function imgDown(id){const b=await (await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).blob();
  let u=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)});
  if(!/^data:image\//.test(u))u='data:image/webp;base64,'+u.slice(u.indexOf(',')+1);return u}
const pool=async(items,n,fn)=>{let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const x=items[i++];try{await fn(x)}catch(e){if(/Drive 40[13]|Failed to fetch/.test(e.message||''))throw e}}}))};
async function imgSync(o){
  if(imgBusy||!idb||!gOn()||!gValid())return;
  const dirty=localStorage.getItem('bh_idirty')==='1',last=+localStorage.getItem('bh_ilast')||0;
  if(!dirty&&!(o&&(o.manual||o.interactive))&&Date.now()-last<IMGINT)return;
  imgBusy=true;const seq=imgSeq;
  try{
    const F=await imgFolder(),list=await imgList(),rem={},dups=[];
    list.forEach(f=>{const p=f.name.slice(imgFile.length);if(!f.name.startsWith(imgFile)||!p)return;if(rem[p])dups.push(f.id);else rem[p]={id:f.id,h:(f.appProperties||{}).h,par:f.parents||[]}});
    const used=new Set(db.products.map(ik).filter(Boolean)),meta=(await idbGet('imgmeta').catch(()=>null))||{},pids=new Set([...Object.keys(IMG),...Object.keys(rem),...Object.keys(meta)]);
    const pull=[],push=[],delR=[],delL=[];
    pids.forEach(p=>{const L=IMG[p],R=rem[p],M=meta[p];
      if(L&&!used.has(p)){delL.push(p);if(R)delR.push(p);return} /* sản phẩm đã bị xóa (kể cả từ máy cũ): dọn ảnh mồ côi */
      if(L&&!R){M?delL.push(p):push.push(p)}
      else if(!L&&R){M?delR.push(p):(used.has(p)&&pull.push(p))}
      else if(L&&R){const lh=imgH(L);if(lh===R.h)meta[p]={h:lh,id:R.id};else if(M&&M.h===R.h)push.push(p);else if(M&&M.h===lh)pull.push(p);else pull.push(p)}
      else delete meta[p]});
    const mvs=Object.keys(rem).filter(p=>!delR.includes(p)&&!(rem[p].par||[]).includes(F)),total=pull.length+push.length+delR.length+delL.length+mvs.length;let done=0;
    const step=()=>{done++;if(total>20&&done%5===0){imgMsg=`Đang đồng bộ ảnh ${done}/${total}…`;gUI()}};
    delL.forEach(p=>{imgDel0(p);delete meta[p]});
    await pool(pull,4,async p=>{const u=await imgDown(rem[p].id);imgSet0(p,u);meta[p]={h:rem[p].h||imgH(u),id:rem[p].id};step()});
    await pool(push,4,async p=>{const u=IMG[p],h=imgH(u),id=await imgUp(p,u,rem[p]&&rem[p].id,h,F);meta[p]={h,id};step()});
    await pool(delR,4,async p=>{await gFetch(`https://www.googleapis.com/drive/v3/files/${rem[p].id}`,{method:'DELETE'});delete meta[p];step()});
    await pool(mvs,4,async p=>{await gFetch(`https://www.googleapis.com/drive/v3/files/${rem[p].id}?addParents=${F}&removeParents=${rem[p].par.join(',')}&fields=id`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{}'});step()});
    await pool(dups,2,async id=>{await gFetch(`https://www.googleapis.com/drive/v3/files/${id}`,{method:'DELETE'})});
    await idbPut('imgmeta',meta).catch(()=>{});
    localStorage.setItem('bh_ilast',String(Date.now()));if(seq===imgSeq)localStorage.setItem('bh_idirty','0');
    imgMsg=total?`Ảnh: đã tải về ${pull.length}, đẩy lên ${push.length}${mvs.length?', gom '+mvs.length+' ảnh vào thư mục '+IMGDIR:''}.`:'';
    if(pull.length||delL.length){if(tab==='products'&&$('#plist')&&!document.querySelector('.pfm'))drawPL();if(tab==='sell'&&$('#lines'))drawLines()}
  }catch(e){imgMsg='Ảnh chưa đồng bộ được, sẽ thử lại.'}
  finally{imgBusy=false;gUI()}
}
{const _g=gSync;gSync=function(o){const p=_g(o);p.then(()=>{if(gOn()&&gState==='ok')imgSync(o||{})}).catch(()=>{});return p}}
{const _t=gStatusText;gStatusText=function(){return _t()+(gOn()&&imgMsg?' '+imgMsg:'')}}
{const _d=gDisc;gDisc=function(){_d();if(!gOn()){imgMsg='';try{localStorage.removeItem('bh_ilast');idbPut('imgmeta',{})}catch(e){}}}}
{const _c=gConnect;gConnect=function(){try{localStorage.removeItem('bh_ilast');if(idb)idbPut('imgmeta',{})}catch(e){}return _c()}}

boot();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
